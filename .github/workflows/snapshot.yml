name: Build dashboard data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "snapshot.html"
      - "data/**"

concurrency:
  group: deck-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      CANVAS_ICS: ${{ secrets.CANVAS_ICS }}
    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Canvas assignments
        run: node scripts/build-canvas.mjs

      - name: Checkout vault (for task snapshot)
        if: env.VAULT_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ChristianFontanez/obsidian-vault
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault
          persist-credentials: false

      - name: Build task snapshot
        if: env.VAULT_TOKEN != ''
        env:
          VAULT_DIR: vault
        run: node scripts/build-snapshot.mjs

      - name: Commit if changed
        run: |
          git config user.name "deck-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/canvas.json snapshot.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: refresh [skip ci]"
            git push
          fi
